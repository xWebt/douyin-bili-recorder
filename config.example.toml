[app]
name = "douyin-bili-recorder"
timezone = "Asia/Shanghai"
data_dir = "data"
poll_interval_seconds = 30
max_reconnect_attempts = 5
reconnect_backoff_seconds = 15

[recording]
segment_time = "1h"
quality = "origin"
frame_rate = "source"
min_file_size_mb = 10
keep_original_files = true

[storage]
max_cache_gb = 10
video_dir = "~/Movies/DouyinBiliRecorder"
late_threshold_minutes = 5
reconnect_grace_minutes = 15

[upload]
biliup_bin = "biliup"
ffmpeg_bin = "ffmpeg"
ffprobe_bin = "ffprobe"
cookie_file = "cookies.json"
line = "bda2"
public = false
delete_after_upload = false
retry_count = 2
retry_backoff_seconds = 30
submit_interval_seconds = 180

[cloud]
rclone_bin = "rclone"
upload_timeout_seconds = 21600
# 网盘驱动：quark/baidu 会优先尝试配置的 CLI，不可用时回退 OpenList/rclone
quark_cli = "quarkpan"
baidu_cli = "bypy"
quark_cookie_file = "quark-cookies.txt"
chunk_size_mb = 4
max_concurrency = 1
# 0 表示不限速；B站上传进行中时网盘默认降到 2 Mbps
bandwidth_limit_kbps = 0
bilibili_priority = true


[launchd]
label = "com.webt.douyin-bili-recorder"

[[targets]]
name = "example-anchor"
url = "https://www.douyin.com/user/REPLACE_ME"
enabled = false
public = false
record_mode = "record"
record_danmaku = false
watch_mode = "all_day"
collection_name = "example-anchor"
collection_id = ""
title_template = "{name}｜{start_date} {start_time} 开播｜{room_title}"
tags = ["直播录像", "抖音"]
tid = 171
copyright = 2
source = ""
cloud_backup = false
cloud_provider = "baidu"
cloud_remote = ""

[[targets.schedule]]
days = [1, 3, 5]
start = "20:00"
end = "23:00"
enabled = true
